# Builds the recorded game parser for every language, reads the test recordings with each, and on a
# version tag (v1.2.3) publishes a release with the parsers and the C# package on nuget.org.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  KSC_VERSION: '0.11'
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  parser:
    name: ${{ matrix.language }}
    strategy:
      fail-fast: false
      matrix:
        language: [csharp, python, java, javascript, go, rust]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # the compiler runs on Java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install kaitai-struct-compiler
        run: |
          curl -fsSLO "https://github.com/kaitai-io/kaitai_struct_compiler/releases/download/$KSC_VERSION/kaitai-struct-compiler_${KSC_VERSION}_all.deb"
          sudo apt-get install -y "./kaitai-struct-compiler_${KSC_VERSION}_all.deb"

      - name: Build the parser
        run: sh scripts/build.sh ${{ matrix.language }} build/${{ matrix.language }}

      - if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - if: matrix.language == 'csharp'
        name: Test and pack
        run: |
          dotnet run --project tests/csharp -c Release -p:Parser="$PWD/build/csharp" -- tests/recordings
          if [ "$GITHUB_REF_TYPE" = tag ]; then version=${GITHUB_REF_NAME#v}; else version=0.0.0-ci.$GITHUB_RUN_NUMBER; fi
          dotnet pack build/csharp -c Release -p:PackageVersion="$version" -o dist
          rm -rf build/csharp/bin build/csharp/obj

      - if: matrix.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: matrix.language == 'python'
        name: Test
        run: |
          pip install "kaitaistruct==0.11" pytest
          AOE2RECORD_PARSER=build/python pytest -v -p no:cacheprovider tests
          rm -rf build/python/__pycache__

      - if: matrix.language == 'java'
        name: Test
        run: |
          curl -fsSLo kaitai-struct-runtime.jar https://repo1.maven.org/maven2/io/kaitai/kaitai-struct-runtime/0.11/kaitai-struct-runtime-0.11.jar
          javac -nowarn -d classes -cp kaitai-struct-runtime.jar build/java/aoekaitai/*.java tests/java/Check.java
          java -cp kaitai-struct-runtime.jar:classes Check tests/recordings

      - if: matrix.language == 'javascript'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - if: matrix.language == 'javascript'
        name: Test
        run: |
          (cd build/javascript && npm install --no-audit --no-fund)
          node tests/javascript/check.js build/javascript tests/recordings
          rm -rf build/javascript/node_modules build/javascript/package-lock.json

      - if: matrix.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - if: matrix.language == 'go'
        name: Test
        working-directory: build/go
        run: |
          go mod tidy
          cp ../../tests/go/recordings_test.go .
          AOE2RECORD_RECORDINGS="$GITHUB_WORKSPACE/tests/recordings" go test -v ./...
          rm recordings_test.go

      - if: matrix.language == 'rust'
        name: Test
        working-directory: build/rust
        run: |
          mkdir tests
          cp ../../tests/rust/recordings.rs tests/
          AOE2RECORD_RECORDINGS="$GITHUB_WORKSPACE/tests/recordings" cargo test --release --test recordings -- --nocapture
          rm -rf tests target Cargo.lock

      - name: Package
        run: |
          mkdir -p dist
          (cd build && zip -qr "../dist/aoe2record-${{ matrix.language }}.zip" "${{ matrix.language }}")

      - uses: actions/upload-artifact@v4
        with:
          name: parser-${{ matrix.language }}
          path: dist/

  release:
    needs: parser
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # nuget.org trusted publishing exchanges the job's OIDC token for a short-lived API key
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: parser-*
          merge-multiple: true
          path: dist

      # a release made on GitHub (which pushes its tag) only gets the files
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
          fi

      # the trusted publishing policy of nuget.org user zeux names this repository and ci.yml
      - name: Log in to nuget.org
        uses: NuGet/login@v1
        id: nuget
        with:
          user: zeux

      - name: Publish the C# package on nuget.org
        run: dotnet nuget push dist/*.nupkg --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
